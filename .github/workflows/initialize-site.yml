name: Initialize official website
on:
  push:
    branches: [main]
    paths: [.github/workflows/initialize-site.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout approved source snapshot
        uses: actions/checkout@v6
        with:
          repository: thegameofavaris-ship-it/avaris-website
          ref: 020815fd1a3cd8a1e98261e44b28225b9a2631d9
          path: _source
      - name: Copy website without changing artwork or layout
        run: |
          rsync -a --exclude='.git/' --exclude='.github/' _source/ ./
          rm -rf _source
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://thegameofavaris-ship-it.github.io/avaris-website/'
          new = 'https://oathoftheseventh.github.io/'
          for name in ('index.html', 'game.html', 'download.html'):
              p = Path(name)
              p.write_text(p.read_text().replace(old, new))
          p = Path('README.md')
          p.write_text(p.read_text().replace(old, new))
          PY
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Copy approved Avaris website to the official Oath of the Seventh address'
          git push origin HEAD:main
      - name: Use GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/${{ github.repository }}/pages -f build_type=workflow
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: copy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
